<!doctype html>
<html><head><meta charset="utf-8"><title>The Ego of the Greats</title>
<style>
@font-face { font-family: "IS"; src: url("is-italic.woff2") format("woff2"); font-style: italic; font-weight: 400; }
@font-face { font-family: "InterV"; src: url("inter.woff2") format("woff2"); font-weight: 100 900; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0A0A0C; }
.L { position: absolute; left: 0; top: 0; }
#t { position: absolute; left: 0; width: 1920px; top: 410px; text-align: center; font-family: IS; font-style: italic; font-size: 150px; color: #FFC94A; white-space: nowrap;
     filter: drop-shadow(0 0 30px rgba(255,201,74,.35)); }
#t span { display: inline-block; }
#sub { position: absolute; left: 0; width: 1920px; top: 640px; text-align: center; font-family: InterV; font-weight: 600; font-size: 22px; color: rgba(236,232,222,.8); text-transform: uppercase; white-space: nowrap; }
#src { position: absolute; left: 0; width: 1920px; top: 690px; text-align: center; font-family: InterV; font-weight: 500; font-size: 15px; color: rgba(236,232,222,.45); letter-spacing: .3em; text-transform: uppercase; }
</style><script src="kit.js"></script></head><body>
<canvas id="c" class="L" width="1920" height="1080"></canvas>
<div id="t"></div><div id="sub"></div><div id="src"></div>
<script>
const { E, clamp } = K; const T = "The Ego of the Greats", LEN = 9.0;
const ctx = document.getElementById("c").getContext("2d");
const motes = Array.from({ length: 90 }, (_, i) => ({ x: (i * 977) % 1920, y: (i * 613) % 1080, s: 0.6 + ((i * 37) % 10) / 6, v: 4 + ((i * 53) % 10), ph: i * 1.7 }));
const L1 = new Path2D("M20 56 C6 46 4 26 14 12 M14 20 C8 18 6 14 7 10 C12 11 15 14 14 20 M11 30 C5 29 2 25 2 21 C7 21 11 25 11 30 M11 40 C5 41 2 38 1 34 C6 33 10 36 11 40 M15 49 C10 52 6 50 4 47 C8 45 13 46 15 49");
function seek(t) {
  const out = 1 - E.inOut(clamp((t - (LEN - 1.2)) / 1.1));
  ctx.clearRect(0, 0, 1920, 1080);
  const g = ctx.createRadialGradient(960, 480, 0, 960, 480, 900); g.addColorStop(0, `rgba(60,44,20,${0.55 * out * clamp(t / 1.5)})`); g.addColorStop(1, "rgba(10,10,12,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1920, 1080);
  for (const m of motes) { const x = (m.x + t * m.v) % 1960 - 20, y = (m.y - t * m.v * 0.4 + 4320) % 1080;
    ctx.fillStyle = `rgba(255,214,150,${0.25 * out * (0.5 + 0.5 * Math.sin(t * 0.9 + m.ph))})`; ctx.beginPath(); ctx.arc(x, y, m.s, 0, 6.283); ctx.fill(); }
  // laurel: two branches draw on around the title
  const q = E.out(clamp((t - 1.6) / 1.8));
  if (q > 0) for (const sx of [-1, 1]) { ctx.save(); ctx.translate(960 + sx * 660, 470); ctx.scale(sx * 7.2, 7.2); ctx.translate(-30, -34);
    ctx.lineCap = "round"; ctx.shadowColor = "rgba(255,201,74,.9)"; ctx.shadowBlur = 20; ctx.strokeStyle = `rgba(255,214,120,${out})`; ctx.lineWidth = 2.2 / 7.2;
    ctx.setLineDash([300 * q, 300]); ctx.stroke(L1); ctx.restore(); }
  // title letters: blur -> sharp, rise, slow tracking open; a light sweep crosses once
  const n = T.length, st = 0.055, sweep = (t - 2.2) / 1.6 * (n + 8) - 4;
  document.getElementById("t").style.letterSpacing = 0.01 + 0.04 * E.dolly(clamp(t / LEN)) + "em";
  document.getElementById("t").innerHTML = [...T].map((c, i) => { const p = E.out(clamp((t - 0.5 - i * st) / 0.9)), sh = Math.exp(-((i - sweep) ** 2) / 5);
    if (c === " ") return '<span style="width:.24em"></span>';
    const col = `rgb(255,${Math.round(201 + 46 * sh)},${Math.round(74 + 148 * sh)})`;
    return `<span style="opacity:${p * out};color:${col};transform:translateY(${(1 - p) * 0.3}em);filter:blur(${(1 - p) * 18}px)">${c}</span>`; }).join("");
  const s = E.out(clamp((t - 3.4) / 1.2)), s2 = E.out(clamp((t - 4.2) / 1.2));
  const sub = document.getElementById("sub"); sub.textContent = "Chapter I  ·  Alexander"; sub.style.opacity = s * out; sub.style.letterSpacing = 0.5 + 0.1 * s + "em"; sub.style.transform = `translateY(${(1 - s) * 14}px)`;
  const src = document.getElementById("src"); src.textContent = "after Plutarch's Lives"; src.style.opacity = s2 * out;
}
window.seek = seek; window.ready = () => seek(0);
</script></body></html>
